<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Evidence ladder</title><desc id="desc">The campaign replaces bounded examples with claim contracts, symbolic certificates, independent checkers, and failing mutation controls.</desc><rect width="1000" height="390" fill="#f8fafc"/><text x="50" y="55" fill="#0f172a" font-family="sans-serif" font-size="28" font-weight="700">What changed in the evidence</text>
  <g font-family="sans-serif"><rect x="50" y="105" width="180" height="180" rx="16" fill="#fee2e2"/><text x="70" y="145" fill="#991b1b" font-size="18" font-weight="700">Historical baseline</text><text x="70" y="180" fill="#7f1d1d" font-size="15">Finite supports</text><text x="70" y="207" fill="#7f1d1d" font-size="15">Finite horizons</text><text x="70" y="234" fill="#7f1d1d" font-size="15">Bounded integers</text><text x="70" y="261" fill="#7f1d1d" font-size="15">Judge: TOY</text>
  <path d="M245 195 H300" stroke="#64748b" stroke-width="4"/><path d="M290 185 L305 195 L290 205" fill="none" stroke="#64748b" stroke-width="4"/><rect x="315" y="105" width="180" height="180" rx="16" fill="#dbeafe"/><text x="335" y="145" fill="#1e3a8a" font-size="18" font-weight="700">Exact contract</text><text x="335" y="180" fill="#1e40af" font-size="15">Source anchors</text><text x="335" y="207" fill="#1e40af" font-size="15">Assumptions</text><text x="335" y="234" fill="#1e40af" font-size="15">Quantifiers</text><text x="335" y="261" fill="#1e40af" font-size="15">Failure condition</text>
  <path d="M510 195 H565" stroke="#64748b" stroke-width="4"/><path d="M555 185 L570 195 L555 205" fill="none" stroke="#64748b" stroke-width="4"/><rect x="580" y="105" width="180" height="180" rx="16" fill="#dcfce7"/><text x="600" y="145" fill="#14532d" font-size="18" font-weight="700">Proof certificate</text><text x="600" y="180" fill="#166534" font-size="15">Symbolic variables</text><text x="600" y="207" fill="#166534" font-size="15">Proof DAG</text><text x="600" y="234" fill="#166534" font-size="15">Independent checker</text><text x="600" y="261" fill="#166534" font-size="15">Raw JSON</text>
  <path d="M775 195 H830" stroke="#64748b" stroke-width="4"/><path d="M820 185 L835 195 L820 205" fill="none" stroke="#64748b" stroke-width="4"/><rect x="845" y="105" width="110" height="180" rx="16" fill="#fef3c7"/><text x="862" y="145" fill="#78350f" font-size="17" font-weight="700">Control</text><text x="862" y="180" fill="#92400e" font-size="14">Mutate key</text><text x="862" y="207" fill="#92400e" font-size="14">premise</text><text x="862" y="240" fill="#92400e" font-size="14">Must exit</text><text x="862" y="267" fill="#92400e" font-size="20" font-weight="700">1</text></g>
  <text x="50" y="340" fill="#475569" font-family="sans-serif" font-size="16">The remaining risk is trust in the small custom certificate schema—not finite-domain coverage.</text>
