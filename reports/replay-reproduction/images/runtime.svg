  <title id="title">Verifier runtimes</title><desc id="desc">Exact verifier runtimes range from 0.017 to 0.042 seconds; every job used Hugging Face cpu-upgrade and reported 64 CPUs.</desc><rect width="1000" height="430" fill="#0f172a"/><text x="55" y="55" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="700">Proof checks are small; orchestration dominates</text><text x="55" y="85" fill="#94a3b8" font-family="sans-serif" font-size="15">Verifier runtime in seconds • HF cpu-upgrade • 64 logical/affinity CPUs reported • no GPU</text>
