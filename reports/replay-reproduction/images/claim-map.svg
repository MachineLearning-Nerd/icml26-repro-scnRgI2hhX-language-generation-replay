<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Claim mechanism map</title><desc id="desc">Each theorem is linked to the central invariant checked by its current proof certificate.</desc><rect width="1000" height="500" fill="#fff"/><text x="50" y="55" fill="#111827" font-family="sans-serif" font-size="28" font-weight="700">Six theorems, six decisive proof mechanisms</text>
  <g font-family="sans-serif"><g transform="translate(50 95)"><rect width="280" height="105" rx="14" fill="#e0f2fe"/><text x="20" y="35" fill="#075985" font-size="20" font-weight="700">C1 • Equivalence</text><text x="20" y="66" fill="#0c4a6e" font-size="15">support closure + two inequalities</text><text x="20" y="90" fill="#0c4a6e" font-size="14">arbitrary sample complexity d</text></g>
  <g transform="translate(360 95)"><rect width="280" height="105" rx="14" fill="#ede9fe"/><text x="20" y="35" fill="#5b21b6" font-size="20" font-weight="700">C2 • Separation</text><text x="20" y="66" fill="#4c1d95" font-size="15">T = max(d,m), intersection exhausted</text><text x="20" y="90" fill="#4c1d95" font-size="14">arbitrary thresholds</text></g><g transform="translate(670 95)"><rect width="280" height="105" rx="14" fill="#dcfce7"/><text x="20" y="35" fill="#166534" font-size="20" font-weight="700">C3 • Witness protection</text><text x="20" y="66" fill="#14532d" font-size="15">termination + criticality + validity</text><text x="20" y="90" fill="#14532d" font-size="14">18 universal obligations</text></g>
  <g transform="translate(50 235)"><rect width="280" height="105" rx="14" fill="#fef3c7"/><text x="20" y="35" fill="#92400e" font-size="20" font-weight="700">C4 • Replay diagonal</text><text x="20" y="66" fill="#78350f" font-size="15">every phase terminates</text><text x="20" y="90" fill="#78350f" font-size="14">infinitely many invalid outputs</text></g><g transform="translate(360 235)"><rect width="280" height="105" rx="14" fill="#ffe4e6"/><text x="20" y="35" fill="#9f1239" font-size="20" font-weight="700">C5 • MQ lower bound</text><text x="20" y="66" fill="#881337" font-size="15">total construction + exhaustive cases</text><text x="20" y="90" fill="#881337" font-size="14">arbitrary deterministic generator</text></g><g transform="translate(670 235)"><rect width="280" height="105" rx="14" fill="#f3e8ff"/><text x="20" y="35" fill="#7e22ce" font-size="20" font-weight="700">C6 • Finite class</text><text x="20" y="66" fill="#6b21a8" font-size="15">four outputs + exact integer cells</text><text x="20" y="90" fill="#6b21a8" font-size="14">two independent routes</text></g></g>
  <path d="M190 390 H810" stroke="#22c55e" stroke-width="12" stroke-linecap="round"/><g fill="#166534" font-family="sans-serif" font-size="15" text-anchor="middle"><text x="190" y="430">contract</text><text x="395" y="430">certificate</text><text x="605" y="430">checker</text><text x="810" y="430">mutation rejected</text></g><g fill="#22c55e"><circle cx="190" cy="390" r="13"/><circle cx="395" cy="390" r="13"/><circle cx="605" cy="390" r="13"/><circle cx="810" cy="390" r="13"/></g>
</svg>
